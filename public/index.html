<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>QuestBoss</title>

<style>
:root{--bg:#120f22;--card:#221c3d;--dark:#0c0a18;--tx:#f4f1ff;--mu:#a79fd0;--cy:#19e3ff;--ma:#ff3df2;--gr:#5cd13a;--ye:#ffe14d;--px:"Press Start 2P",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(115deg,rgba(25,227,255,.13) 0 50%,rgba(255,61,242,.13) 50% 100%)}
#app{max-width:560px;margin:0 auto;padding:0 12px calc(150px + env(safe-area-inset-bottom))}
h2,h3,.logo,.lv,.vt{font-family:var(--px);font-weight:400}
h2{font-size:13px;margin:16px 0 10px;line-height:1.5}
h3{font-size:11px;margin:0 0 10px;line-height:1.6}
p{margin:6px 0;line-height:1.45;color:var(--mu)}
.hud{padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top{display:flex;align-items:center;gap:8px}
.logo{flex:1;font-size:14px;background:linear-gradient(90deg,var(--cy),var(--ma));-webkit-background-clip:text;background-clip:text;color:transparent}
select,input[type=text],input[type=date],input[type=time],input[type=password],input[type=number]{background:var(--dark);color:var(--tx);border:3px solid #000;padding:0 10px;min-height:44px;font-size:16px;width:100%;font-family:inherit;border-radius:0}
select{width:auto;max-width:130px}
textarea{background:var(--dark);color:var(--tx);border:3px solid #000;padding:10px;font-size:16px;width:100%;min-height:110px;font-family:inherit;border-radius:0;resize:vertical}
.pwwrap{position:relative}.pwwrap input{padding-right:50px}.pwt{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:transparent;font-size:18px;color:var(--tx);padding:0}
.icobtn{width:44px;height:44px;border:3px solid #000;background:var(--card);font-size:20px;color:var(--tx);box-shadow:inset 0 3px 0 rgba(255,255,255,.12)}
.me{display:flex;gap:12px;align-items:center;margin-top:10px}
.av{width:64px;height:64px;flex:none;border:3px solid #000;background:var(--card);box-shadow:inset 0 3px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.35);font-size:34px;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.mi{flex:1;min-width:0}
.lv{font-size:12px;margin-bottom:6px}
.bar{height:20px;background:var(--dark);border:3px solid #000;overflow:hidden}
.fill{height:100%;background:repeating-linear-gradient(45deg,#5cd13a 0 8px,#49b02b 8px 16px);transition:width .5s}
.bar.big{height:16px;margin:8px 0}
.stats{display:flex;gap:12px;margin-top:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
.split{height:5px;background:linear-gradient(90deg,var(--cy) 0 50%,var(--ma) 50% 100%);margin-bottom:4px}
.card{background:var(--card);border:3px solid #000;box-shadow:inset 0 3px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.35);padding:12px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;background:var(--ye);color:#000;border:3px solid #000;box-shadow:0 4px 0 #000;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer;font-family:inherit;border-radius:3px}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.sm{min-height:40px;padding:0 10px;font-size:14px}
.btn.gh{background:var(--card);color:var(--tx)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ma{background:var(--ma);color:#fff}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid #000;box-shadow:inset 0 3px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.35);padding:10px;margin:8px 0}
.chk{width:44px;height:44px;flex:none;background:var(--dark);border:3px solid #000;color:#fff;font-size:24px;font-weight:900;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.08)}
.row.done .chk{background:var(--gr)}
.row.pend .chk{background:var(--ye);font-size:20px}
.rt{flex:1;min-width:0}
.tt{font-weight:700;word-break:break-word}
.mt{font-size:13px;color:var(--mu);margin-top:3px}
.row.done .tt{text-decoration:line-through;color:var(--gr)}
.row.pend .mt{color:var(--ye)}
.pgbar{margin:6px 0 12px}
.hello{font-family:var(--px);font-size:15px;line-height:1.5;margin:14px 0 0;word-break:break-word}
.tipc{display:flex;gap:10px}
.tipc .e{font-size:30px}
.tipc b{display:block;margin-bottom:3px}
.tipc span{color:var(--mu);line-height:1.45}
.mini{display:flex;gap:8px;padding:6px 0;border-top:2px solid rgba(255,255,255,.08);font-size:15px}
.mini:first-of-type{border-top:0}
.mini.d{color:var(--gr);text-decoration:line-through}
.mini .tm{color:var(--cy);min-width:44px}
.dh{font-family:var(--px);font-size:10px;margin-bottom:6px;color:var(--cy)}
.free{color:var(--mu);font-size:14px}
.sm2{display:flex;gap:6px}
.ib{width:42px;height:42px;border:3px solid #000;background:var(--dark);font-size:18px;padding:0;color:var(--tx)}
.ib.off{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cell{background:var(--dark);border:3px solid #000;padding:8px 4px;text-align:center;font-size:12px;color:var(--tx);min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cell .e{font-size:30px}
.cell.lock{filter:grayscale(1);opacity:.4}
.cell.dim{opacity:.55}
.cell.on{border-color:var(--ye)}
.warn{color:var(--ye);font-weight:700}
.pay{display:flex;gap:10px;margin:10px 0}
.pay .btn{flex:1}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--dark);border-top:4px solid #000;padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;color:var(--mu);min-height:60px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button span{font-size:22px}
.nav button.on{color:var(--cy);box-shadow:inset 0 4px 0 var(--ma)}
.fab{position:fixed;z-index:21;right:max(16px,calc(50vw - 264px));bottom:calc(76px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--ma);color:#fff;border:3px solid #000;box-shadow:0 4px 0 #000;font-size:34px;font-weight:900;line-height:1;padding:0}
.fab:active{transform:translateY(4px);box-shadow:none}
.sbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border:3px solid #000;border-bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:inset 0 3px 0 rgba(255,255,255,.12)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:64px;min-height:44px;background:var(--dark);color:var(--tx);border:3px solid #000;font-weight:700;font-size:14px;padding:0 8px}
.seg button.on{background:var(--cy);color:#000}
.err{color:#ff7b9c;min-height:20px;margin-top:6px;font-weight:700}
.pv{display:flex;justify-content:center;margin:12px 0}
.pv .av{width:96px;height:96px;font-size:54px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--dark);border:3px solid var(--cy);padding:8px 14px;font-weight:800;box-shadow:0 4px 0 #000;max-width:90vw;text-align:center;animation:ti .25s}
@keyframes ti{from{transform:translateY(-14px);opacity:0}}
.orb{position:fixed;left:0;top:0;width:12px;height:12px;border-radius:50%;background:#9dff3a;box-shadow:0 0 10px 3px #7dff2a;z-index:80;pointer-events:none}
.conf{position:fixed;z-index:80;pointer-events:none}
.flash{position:fixed;inset:0;z-index:85;pointer-events:none;background:linear-gradient(115deg,var(--cy) 0 50%,var(--ma) 50% 100%)}
.vic{position:fixed;left:50%;top:38%;z-index:88;transform:translate(-50%,-50%) rotate(-6deg);background:var(--ye);color:#000;border:4px solid #000;box-shadow:6px 6px 0 #000;padding:16px 22px;text-align:center;pointer-events:none;animation:vp .5s}
.vic .vt{font-size:16px;line-height:1.5}
.vic div:last-child{font-weight:800;margin-top:6px}
@keyframes vp{from{transform:translate(-50%,-50%) rotate(-6deg) scale(.3);opacity:0}}
.joke q{display:block;font-size:18px;line-height:1.5;margin:10px 0;quotes:none;font-weight:700}
.joke .pl{font-size:18px;color:var(--ye);font-weight:800;margin:10px 0}
.av{position:relative}
.av .acc{position:absolute;right:3px;top:1px;font-size:.42em;line-height:1;filter:drop-shadow(0 1px 0 #000)}
.av.big{width:120px;height:120px;font-size:68px;margin:6px auto 10px}
.charc{text-align:center}
.cn{font-family:var(--px);font-size:13px;line-height:1.6;word-break:break-word;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-width:48px;min-height:48px;background:var(--dark);border:3px solid #000;font-size:24px;padding:0 8px;color:var(--tx)}
.chips button.on{border-color:var(--ye)}
.chips button.sw{width:48px;padding:0;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.orb,.conf,.flash{display:none!important}}
</style>
</head>

 for(let i=0;i<6;i++){const o=document.createElement("div");o.className="orb";document.body.appendChild(o);
  const mx=(sx+tx)/2+(Math.random()-.5)*120,my=Math.min(sy,ty)-30-Math.random()*60;
  const an=o.animate([{transform:`translate(${sx}px,${sy}px) scale(1)`,opacity:1},{transform:`translate(${mx}px,${my}px) scale(1.2)`,opacity:1,offset:.45},{transform:`translate(${tx}px,${ty}px) scale(.4)`,opacity:.9}],{duration:750+Math.random()*300,delay:i*70,easing:"ease-in",fill:"backwards"});
  an.onfinish=()=>o.remove()}}
function confetti(n,cols){if(RM)return;cols=cols||["#19e3ff","#ff3df2","#5cd13a","#ffe14d","#fff"];
 for(let i=0;i<n;i++){const p=document.createElement("div");p.className="conf";const sz=6+Math.random()*7;p.style.cssText=`width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};left:${Math.random()*100}vw;top:-12px`;document.body.appendChild(p);
  const dx=(Math.random()-.5)*160,an=p.animate([{transform:"translate(0,0) rotate(0)"},{transform:`translate(${dx}px,${window.innerHeight+30}px) rotate(${Math.random()*720}deg)`}],{duration:1600+Math.random()*1400,delay:Math.random()*300,easing:"cubic-bezier(.3,.6,.5,1)",fill:"backwards"});an.onfinish=()=>p.remove()}}
function flash(){if(RM)return;const f=document.createElement("div");f.className="flash";document.body.appendChild(f);const a=f.animate([{opacity:0},{opacity:.75,offset:.25},{opacity:0}],{duration:600});a.onfinish=()=>f.remove()}

 if(INFAM&&ow.length){h+=`<h2>${t("wishFam")}</h2><p class="mt">${t("wishHint")}</p>`+ow.map(m=>`<div class="card"><h3>${m.role==="child"?"🧒":"🧑"} ${esc(m.name)}</h3>`+m.wishes.map(w=>`<div class="row"><div class="rt"><div class="tt">${esc(w.t)}</div><div class="mt">${esc(w.p||"")}${w.res?(w.p?" · ":"")+"🔒 "+esc(t("wishBy",w.res)):""}</div></div>${(!w.res||w.mineRes)?`<button class="btn sm${w.mineRes?" gh":""}" data-a="wishres" data-n="${esc(m.name)}" data-id="${esc(w.id)}" data-on="${w.mineRes?"0":"1"}">${t(w.mineRes?"wishFree":"wishRes")}</button>`:""}</div>`).join("")+`</div>`).join("")}
 return h}

function sugBlock(){const l=ADM.sug||[];return `<div class="card"><h3>💡 ${t("sugAdmin")} (${l.length})</h3>`+(l.length?l.map(x=>`<div class="row ${x.done?"done":""}"><div class="rt"><div class="tt" style="white-space:pre-wrap">${esc(x.text)}</div><div class="mt">${esc(x.user)} · ${esc(String(x.ts||"").slice(0,10))}</div></div><button class="ib" data-a="sugdone" data-id="${esc(x.id)}" aria-label="${esc(t("aChk"))}">${x.done?"↩️":"✓"}</button><button class="ib" data-a="sugdel" data-id="${esc(x.id)}" aria-label="${esc(t("del"))}">🗑️</button></div>`).join(""):`<p>${t("sugNone")}</p>`)+`</div>`}

function renderLogin(err){
 document.title=appName();document.documentElement.lang=S.lang;
 $("#app").innerHTML=`<div style="padding-top:calc(24px + env(safe-area-inset-top))"><div class="top"><div class="logo" style="font-size:18px">${appName()}</div>
 <button class="icobtn" data-a="settings" aria-label="${esc(t("settings"))}">⚙️</button></div>
 <div class="split" style="margin:14px 0"></div>
 <form class="card" id="lf" method="post" action="#"><h3>${t(LM==="login"?"loginT":"regT")}</h3>${JOINT?`<p class="mt">👪 ${t("joinLogin")}</p>`:""}
 ${LM==="register"?`<label>${t("roleLbl")}</label><div class="seg"><button type="button" data-a="rl" data-v="child" class="${RL==="child"?"on":""}">${t("roleChild")}</button><button type="button" data-a="rl" data-v="adult" class="${RL==="adult"?"on":""}">${t("roleAdult")}</button></div>`:""}<label>${t("user")}</label><input type="text" id="lu" name="username" maxlength="20" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
 <label>${t("pass")}</label><input type="password" id="lp" name="password" maxlength="100" autocomplete="${LM==="login"?"current-password":"new-password"}">
 <div class="err" id="lerr">${err?esc(err):""}</div>
 <div class="btns"><button class="btn" type="submit">${t(LM==="login"?"loginBtn":"regBtn")}</button></div>
 <div class="btns"><button class="btn gh" type="button" data-a="lswitch">${t(LM==="login"?"toReg":"toLogin")}</button></div></form></div>`;
 const lf=$("#lf");if(lf)lf.addEventListener("submit",e=>{e.preventDefault();doAuth(lf.querySelector("button[type=submit]"))})}
async function doAuth(btn){
 const u=($("#lu").value||"").trim(),p=$("#lp").value||"",er=$("#lerr");
 if(!/^[A-Za-z0-9][A-Za-z0-9_-]{2,19}$/.test(u)){er.textContent=t("errUser");return}
 if(LM==="register"&&p.length<8){er.textContent=t("errPass");return}
 if(!p){er.textContent=t("errLogin");return}
 btn.disabled=true;er.textContent="";
 try{const r=await api(LM==="login"?"/api/login":"/api/register","POST",{username:u,password:p,role:RL});
  if(r.ok&&r.j.user){try{if(window.PasswordCredential&&navigator.credentials)navigator.credentials.store(new PasswordCredential({id:u,password:p,name:u}))}catch(e){}USER=r.j.user;ADMIN=!!r.j.admin;ROLE=r.j.role||"adult";MUST=!!r.j.mustChange;applyMe(r.j);const lang=S.lang,st=r.j.state;S=Object.assign(def(),st||{});if(!st||!st.lang)S.lang=lang;tab="today";
   if(LM==="register"||!st||!Object.keys(st).length){dirty=true;push()}render();sfx.ok();if(ROLE==="adult"||INFAM)loadFamily(true);applyGrants(r.j.grants);return}
  const m={bad:"errLogin",taken:"errTaken",user:"errUser",pass:"errPass",rate:"errRate",closed:"errClosed"};
  er.textContent=t(m[r.j.error]||"errNet")}
 catch(e){er.textContent=t("errNet")}
 btn.disabled=false}
async function doLogout(){clearTimeout(saveT);await push();try{await api("/api/logout","POST",{})}catch(e){}
 const l=S.lang;USER=null;ADMIN=false;ADM={users:[],allow:true};ROLE="adult";MUST=false;FAMC=false;FAM={plans:[],inFamily:false,members:[],rewards:[],shop:[]};S=def();S.lang=l;tab="today";LM="login";render()}
function render(){
 if(!USER){renderLogin();return}
 if(MUST){renderMust();return}
 const v=tab==="today"?viewToday():tab==="plan"?viewPlan():tab==="lists"?viewLists():tab==="acct"?viewAcct():viewLoot();
 const nb=(k,e,l)=>`<button class="${tab===k?"on":""}" data-a="tab" data-v="${k}"><span>${e}</span>${t(l)}</button>`;
 $("#app").innerHTML=hud()+v+`<nav class="nav"><div>${nb("today","⚔️","nav_today")}${nb("plan","🗺️","nav_plan")}${nb("loot","🎁","nav_loot")}${nb("lists","📝","nav_lists")}${nb("acct","👤","nav_acct")}</div></nav><button class="fab" data-a="add" aria-label="${esc(t("newQ"))}">+</button>`;
  document.title=appName();document.documentElement.lang=S.lang;if(JOINT&&!JBUSY&&!document.querySelector(".sbg"))maybeJoin()}

/* ===== Events ===== */
function act(a,b){
 const it=b.dataset.id?S.items.find(x=>x.id===b.dataset.id):null;
 switch(a){
 case "tab":tab=b.dataset.v;render();window.scrollTo(0,0);if(tab==="acct"&&ADMIN)loadAdmin();if((tab==="acct"||tab==="lists"||tab==="plan")&&(ROLE==="adult"||INFAM))loadFamily(true);break;
 case "add":openForm();break;
 case "close":closeSheet();break;
 case "snd":S.sound=!S.sound;save();render();sfx.ok();break;
 case "chk":if(it)toggle(it,b.dataset.d,b);break;
 case "confirm":if(it){const d=b.dataset.d;guard(()=>{setPend(it,d,false);setDone(it,d,true);award(it,d,b)})}break;
 case "tipnext":{const n=(TIPS[S.lang]||TIPS.de).length;let k=Math.floor(Math.random()*n);if(n>1&&k===S.tipIdx)k=(k+1)%n;S.tipIdx=k;S.tipN++;save();render();break}
 case "tipread":{const td=todayS();if(!S.tipSeen[td]){S.tipSeen[td]=1;gain(5,b)}break}
 case "joke":openJoke(false);break;
 case "ap":if(it)guard(()=>{it.ap=!it.ap;
   if(!it.ap){if(it.rec==="once"&&it.pendOn){const d=it.pendOn;setPend(it,d,false);setDone(it,d,true);award(it,d,null);return}
    Object.keys(S.pend).forEach(d=>{const x=S.pend[d].indexOf(it.id);if(x>=0){S.pend[d].splice(x,1);setDone(it,d,true);S.xp+=exp(it);S.coins+=exp(it);S.act[d]=(S.act[d]||0)+1}});checkBadges()}
   save();render()});break;
 case "del":if(it)dbl(b,()=>{S.items=S.items.filter(x=>x.id!==it.id);save();sfx.undo();render()});break;
 case "skin":{const k=SK.find(x=>x[0]===b.dataset.v);if(!k)break;
   if(S.owned.includes(k[0])){S.skin=k[0];S.usePhoto=false;sfx.ok();save();render()}
   else if(S.coins>=k[1]){S.coins-=k[1];S.owned.push(k[0]);S.skin=k[0];S.usePhoto=false;sfx.chest();confetti(40,["#ffe14d","#ffb300","#fff2a8"]);toast(t("skinBought"));save();render()}
   else{toast(t("tooLittle"));sfx.undo()}break}
 case "redeem":{const r=S.rewards.find(x=>x.id===b.dataset.id);if(r&&S.coins>=r.c){S.coins-=r.c;sfx.chest();confetti(45);toast(t("redeemed",rewName(r)));save();render()}break}
 case "rwadd":{const n=($("#rwn").value||"").trim(),c=Math.floor(Number($("#rwc").value));
   if(!n||!(c>0)){sfx.undo();break}
   guard(()=>{if(INFAM){api("/api/family/reward","POST",{name:n,cost:c}).then(r=>{if(r.ok){sfx.save();reloadState()}else toast(t("errNet"))})}else{S.rewards.push({id:"r"+Date.now().toString(36),n,c});save();sfx.save();render()}});break}
 case "rwdel":dbl(b,()=>guard(()=>{if(INFAM){api("/api/family/rewarddel","POST",{id:b.dataset.id}).then(()=>reloadState())}else{S.rewards=S.rewards.filter(x=>x.id!==b.dataset.id);save();render()}}));break;
 case "pinset":{const v=$("#pinnew").value;if(!/^\d{4}$/.test(v)){toast(t("pinNeed"));break}S.pin=v;save();sfx.save();render();break}
 case "pindel":guard(()=>{S.pin="";save();render()});break;
 case "reset":dbl(b,()=>guard(()=>{const l=S.lang;S=def();S.lang=l;save();tab="today";render()}));break;
 case "profile":openProfile();break;
 case "pfile":$("#pfile").click();break;
 case "puse":if(P.photo){P.usePhoto=true;profSync()}break;
 case "prm":P.photo="";P.usePhoto=false;profSync();break;
 case "pskin":P.skin=b.dataset.v;P.usePhoto=false;profSync();break;
 case "pbg":P.bg=b.dataset.v;profSync();break;
 case "pacc":P.acc=b.dataset.v;profSync();break;
 case "settings":openSettings();break;
 case "setlang":S.lang=b.dataset.v;save();render();openSettings();break;
 case "setsnd":S.sound=b.dataset.v==="1";save();sfx.ok();openSettings();break;
 case "psave":S.name=P.name.trim().slice(0,20);S.photo=P.photo;S.usePhoto=!!(P.usePhoto&&P.photo);if(S.owned.includes(P.skin))S.skin=P.skin;S.bg=BGS.includes(P.bg)?P.bg:"";S.acc=ACC.includes(P.acc)?P.acc:"";save();sfx.save();closeSheet();render();break;
 case "admreg":api("/api/admin/registration","POST",{allow:!ADM.allow}).then(()=>loadAdmin());break;
 case "admdel":dbl(b,()=>api("/api/admin/delete","POST",{username:b.dataset.n}).then(()=>loadAdmin()));break;
 case "admpw":pwSheet(b.dataset.n,"/api/admin/password");break;
 case "fampw":pwSheet(b.dataset.n,"/api/family/password");break;
 case "famdel":dbl(b,()=>api("/api/family/delete","POST",{username:b.dataset.n}).then(()=>loadFamily()));break;
 case "famadd":childSheet();break;
 case "plnew":planSheet();break;
 case "plpick":plpick(b);break;
 case "plsave":plsave(b);break;
 case "pldel":dbl(b,()=>api("/api/family/plan","POST",{op:"del",id:b.dataset.id}).then(()=>reloadState()));break;
 case "sugopen":sugSheet();break;
 case "sugdone":case "sugdel":api("/api/admin/suggestion","POST",{id:b.dataset.id,op:a==="sugdel"?"del":"done"}).then(()=>loadAdmin());break;
 case "famdisp":api("/api/family/dispute","POST",{username:b.dataset.n,on:b.dataset.on==="1"}).then(()=>loadFamily(true));break;
 case "famok":case "famno":api(a==="famok"?"/api/family/confirm":"/api/family/reject","POST",{username:b.dataset.n,id:b.dataset.id,d:b.dataset.d}).then(r=>{if(r.ok)sfx.ok();loadFamily()});break;
 case "famtask":FAMC_TO=b.dataset.n;openForm();break;
 case "famtdel":dbl(b,()=>api("/api/family/taskdel","POST",{username:b.dataset.n,id:b.dataset.id}).then(()=>loadFamily()));break;
 case "famradd":rewSheet();break;
 case "famrdel":dbl(b,()=>api("/api/family/rewarddel","POST",{id:b.dataset.id}).then(()=>{reloadState();loadFamily(true)}));break;
 case "rwto":api("/api/family/rewardto","POST",{id:b.dataset.id,username:b.dataset.n,on:b.dataset.on!=="1"}).then(()=>{reloadState();loadFamily(true)});break;
 case "faminv":{const v=($("#invn").value||"").trim();if(!v)break;api("/api/family/invite","POST",{username:v}).then(r=>{if(r.ok){toast(t("famInvSent"));$("#invn").value="";sfx.ok()}else{sfx.undo();toast(t(r.j.error==="unknown"?"famInvUnknown":r.j.error==="infamily"?"famInvIn":r.j.error==="rate"?"errRate":"errNet"))}});break}
 case "famlink":api("/api/family/link","POST",{}).then(r=>{if(!r.ok||!r.j.token){toast(t("errNet"));return}
   const url=location.origin+location.pathname+"?join="+r.j.token;
   const s=sheet(`<h3>🔗 ${t("linkBtn")}</h3><p>${t("linkHint")}</p><input type="text" id="lkv" readonly value="${esc(url)}"><div class="btns"><button class="btn gh" data-a="close">${t("close")}</button><button class="btn" id="lkc">${t("linkCopy")}</button></div>`);
   const inp=s.querySelector("#lkv");inp.onfocus=()=>inp.select();
   s.querySelector("#lkc").onclick=()=>{inp.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}try{if(navigator.clipboard)navigator.clipboard.writeText(url)}catch(e){}toast(t("linkCopied"));sfx.ok()}});break;
 case "invacc":case "invdec":api(a==="invacc"?"/api/family/accept":"/api/family/decline","POST",{id:b.dataset.id}).then(()=>reloadState());break;
 case "famleave":dbl(b,()=>api("/api/family/leave","POST",{}).then(r=>{if(!r.ok&&r.j.error==="kids")toast(t("famLeaveKids"));reloadState()}));break;
 case "shopadd":{const el=$("#shn"),v=(el.value||"").trim();if(!v)break;el.value="";
   if(INFAM)api("/api/family/shop","POST",{op:"add",t:v}).then(()=>loadFamily(true));else{S.shop.push({id:uid(),t:v.slice(0,60),done:false});save();sfx.save();render()}break}
 case "shoptog":if(INFAM)api("/api/family/shop","POST",{op:"toggle",id:b.dataset.id}).then(()=>loadFamily(true));else{const x=S.shop.find(y=>y.id===b.dataset.id);if(x){x.done=!x.done;sfx.ok();save();render()}}break;
 case "shopdel":if(INFAM)api("/api/family/shop","POST",{op:"del",id:b.dataset.id}).then(()=>loadFamily(true));else{S.shop=S.shop.filter(y=>y.id!==b.dataset.id);save();render()}break;
 case "shopclr":if(INFAM)api("/api/family/shop","POST",{op:"clear"}).then(()=>loadFamily(true));else{S.shop=S.shop.filter(y=>!y.done);save();render()}break;
 case "wishadd":{const v=($("#wn").value||"").trim();if(!v)break;S.wishes.push({id:uid(),t:v.slice(0,60),p:($("#wp").value||"").trim().slice(0,20)});save();sfx.save();render();break}
 case "wishdel":S.wishes=S.wishes.filter(y=>y.id!==b.dataset.id);save();render();break;
 case "wishres":api("/api/family/wishres","POST",{username:b.dataset.n,id:b.dataset.id,on:b.dataset.on==="1"}).then(r=>{if(!r.ok)toast(t("errNet"));loadFamily(true)});break;
 case "rl":RL=b.dataset.v;document.querySelectorAll("[data-a=rl]").forEach(x=>x.classList.toggle("on",x.dataset.v===RL));break;
 case "pwgo":doChangePw(b);break;
 case "pwopen":sheet(`<h3>${t("pwChange")}</h3>${pwFields()}<div class="btns"><button class="btn gh" data-a="close">${t("cancel")}</button><button class="btn" data-a="pwgo">${t("save")}</button></div>`);break;
 case "lgo":doAuth(b);break;
 case "lswitch":LM=LM==="login"?"register":"login";renderLogin();break;
 case "logout":doLogout();break;
 case "fsave":fsave();break}}
document.addEventListener("click",e=>{
 const g=e.target.closest("#ppgo");
 if(g){const v=parseFloat(String($("#ppamt").value||"").replace(",","."));if(!(v>0)||v>10000){e.preventDefault();toast(t("amtNeed"));return}g.href=PP.replace(/\/$/,"")+"/"+v.toFixed(2)+"EUR";return}
 const f=e.target.closest("[data-f]");if(f){fclick(f);return}
 const b=e.target.closest("[data-a]");if(b)act(b.dataset.a,b)});
document.addEventListener("input",e=>{
 if(e.target.id==="pname"&&P)P.name=e.target.value;
 if(e.target.id==="f-date"&&F){F.date=e.target.value||todayS();if(F.rec==="weekly"&&!F.touched){F.days=[pd(F.date).getDay()];fsync()}}});
document.addEventListener("change",e=>{
 if(e.target.id==="lang"){S.lang=e.target.value;save();render()}
 if(e.target.id==="pfile"&&P&&e.target.files[0]){procPhoto(e.target.files[0],u=>{P.photo=u;P.usePhoto=true;profSync()})}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const m={lp:"lgo",shn:"shopadd",wn:"wishadd",wp:"wishadd",invn:"faminv"}[e.target.id];if(m){const b=$("[data-a="+m+"]");if(b&&!b.disabled)b.click()}});
window.addEventListener("pagehide",()=>{clearTimeout(saveT);push(true)});
async function applyGrants(gs){if(!gs||!gs.length)return;let n=0;
 gs.forEach(g=>{const it=S.items.find(x=>x.id===g.id);if(!it)return;
  if(g.type==="ok"&&isPend(it,g.d)&&!isDone(it,g.d)){setPend(it,g.d,false);setDone(it,g.d,true);toast(t("kidApproved"));award(it,g.d,null);n++}
  else if(g.type==="no"&&isPend(it,g.d)){setPend(it,g.d,false);n++}});
 clearTimeout(saveT);dirty=true;await push();
 try{await api("/api/ack","POST",{ids:gs.map(g=>g.n)})}catch(e){}render()}
let syncing=false;
async function syncFam(){
 if(syncing||document.visibilityState!=="visible"||!USER||MUST||dirty||document.querySelector(".sbg"))return;syncing=true;
 try{const r=await api("/api/me");
  if(r.ok&&r.j.user&&r.j.state&&!dirty&&!document.querySelector(".sbg")){
   const was=JSON.stringify([FAMC,INFAM,INV]);applyMe(r.j);const ns=Object.assign(def(),r.j.state);
   const ae=document.activeElement,typing=!!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
   if(!typing&&(JSON.stringify(ns)!==JSON.stringify(S)||was!==JSON.stringify([FAMC,INFAM,INV]))){S=ns;render()}
   await applyGrants(r.j.grants);
   if(ROLE==="adult"||INFAM)loadFamily()}
  else if(r.ok&&!r.j.user){USER=null;render()}}catch(e){}
 syncing=false}
document.addEventListener("visibilitychange",syncFam);
setInterval(()=>{if(USER)syncFam()},20000);
function pwEnhance(){document.querySelectorAll("input[type=password]:not([inputmode=numeric])").forEach(i=>{
 if(i.parentNode&&i.parentNode.classList&&i.parentNode.classList.contains("pwwrap"))return;
 const focus=document.activeElement===i,w=document.createElement("div");w.className="pwwrap";i.parentNode.insertBefore(w,i);w.appendChild(i);
 const b=document.createElement("button");b.type="button";b.className="pwt";b.textContent="👁️";b.setAttribute("aria-label",t("showPw"));
 b.onclick=()=>{const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"🙈":"👁️";b.setAttribute("aria-label",t(show?"hidePw":"showPw"));i.focus()};
 w.appendChild(b);if(focus)i.focus()})}
new MutationObserver(pwEnhance).observe(document.body,{childList:true,subtree:true});
load();
(async()=>{try{const r=await api("/api/me");if(r.ok&&r.j.user){USER=r.j.user;ADMIN=!!r.j.admin;ROLE=r.j.role||"adult";MUST=!!r.j.mustChange;applyMe(r.j);const lang=S.lang;S=Object.assign(def(),r.j.state||{});if(!r.j.state||!r.j.state.lang)S.lang=lang;render();if((ROLE==="adult"||INFAM)&&!MUST)loadFamily(true);if(!MUST)applyGrants(r.j.grants)}}catch(e){}render()})();
