name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: node --check server.js

      - name: Tag must match package.json version
        run: |
          V="$(node -p "require('./package.json').version")"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version v$V"; exit 1; }

      - name: Build release archive
        run: |
          tar czf questboss.tar.gz --owner=0 --group=0 server.js package.json README.md public
          sha256sum questboss.tar.gz > questboss.tar.gz.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" questboss.tar.gz questboss.tar.gz.sha256 \
            --title "QuestBoss $GITHUB_REF_NAME" --generate-notes
